name: Submit a stage
description: Ask the verifier to check your public repository
title: "[Submit] "
labels: ["submission"]
body:
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options: ["1", "2", "3", "4", "5", "6", "7"]
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Your lab repository
      description: Stages 1 to 6 use your-username/git-lab. Stage 7 uses your new project, your-username/project-name.
      placeholder: your-username/git-lab
    validations:
      required: true
